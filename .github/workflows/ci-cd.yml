# .github/workflows/ci-cd.yml

name: CI/CD for Readmission Prediction API

# 1. TRIGGER: This workflow runs on every push to the 'main' branch.
on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Add permissions for the job to write to GitHub Packages (GHCR).
    permissions:
      contents: read
      packages: write

    steps:
      # 2. CHECKOUT CODE: Checks out your repository's code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. SET UP PYTHON: Sets up the Python environment and caches dependencies.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can change this to your specific version.
          cache: 'pip' # Caches pip dependencies to speed up future runs.

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 4. RUN FAST UNIT TESTS: Runs tests that don't need data or a full pipeline.
      - name: Run fast unit tests
        run: pytest tests/test_main.py tests/test_predict.py

      # 5. BUILD DOCKER IMAGE: Builds the main application image.
      - name: Build Docker image
        run: docker build -t readmission-api .

      # 6. RUN FULL PIPELINE & INTEGRATION TESTS
      - name: Run training pipeline on sample data
        run: |
          docker run --rm \
            -v ./sample_data:/app/data \
            -v ./output:/app/output \
            -v ./models:/app/models \
            readmission-api python pipeline.py

      - name: Run ETL integration tests on generated database
        run: |
          docker run --rm \
            -v ./output:/app/output \
            readmission-api pytest tests/test_etl.py

      # 7. SMOKE TEST: Runs the API container and checks if it's responsive.
      - name: Run API smoke test
        run: |
          docker run -d --name api_test -p 8000:8000 \
            -v ./output:/app/output \
            -v ./models:/app/models \
            readmission-api
          echo "Waiting for API server to start..."
          sleep 15
          curl -f http://127.0.0.1:8000/docs

      # 8. LOG IN TO GHCR: Logs into the GitHub Container Registry.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. TAG & PUSH IMAGE: Tags the image with the Git SHA and pushes it to GHCR.
      - name: Tag and push Docker image to GHCR
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag readmission-api $IMAGE_ID
          docker push $IMAGE_ID
          echo "✅ Image pushed to $IMAGE_ID"