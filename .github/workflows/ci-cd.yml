# .github/workflows/ci-cd.yml

name: CI/CD for Readmission Prediction API

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run fast unit tests
        run: pytest tests/test_main.py tests/test_predict.py

      - name: Build Docker image
        run: docker build -t readmission-api .

      - name: Run training pipeline on sample data
        run: |
          docker run --rm \
            -v ./sample_data:/app/data \
            -e FHIR_PATH=/app/data \
            -v ./output:/app/output \
            -v ./models:/app/models \
            readmission-api python -m src.pipeline

      # vvv CHANGE IS IN THIS STEP vvv
      - name: Run ETL integration tests on generated database
        run: |
          docker run --rm \
            -v ./output:/app/output \
            readmission-api pytest -m "not full_dataset" tests/test_etl.py # <-- ADDED -m FLAG

      - name: Run API smoke test
        run: |
          docker run -d --name api_test -p 8000:8000 \
            -v ./output:/app/output \
            -v ./models:/app/models \
            readmission-api
          echo "Waiting for API server to start..."
          sleep 15
          curl -f http://127.0.0.1:8000/docs

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image to GHCR
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag readmission-api $IMAGE_ID
          docker push $IMAGE_ID
          echo "✅ Image pushed to $IMAGE_ID"