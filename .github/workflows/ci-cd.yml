name: CI for Readmission Prediction API

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Check Python source
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Build Docker image from a clean checkout
        run: docker build --build-arg INSTALL_DEV=true --tag readmission-api .

      - name: Prepare isolated CI artifact directories
        run: mkdir -p .ci/output .ci/models

      - name: Run pipeline on sample data
        run: |
          docker run --rm \
            -e FHIR_PATH=/app/data \
            -v "$PWD/sample_data:/app/data:ro" \
            -v "$PWD/.ci/output:/app/output" \
            -v "$PWD/.ci/models:/app/models" \
            readmission-api python -m src.pipeline

      - name: Run portable ETL integration tests
        run: |
          docker run --rm \
            -v "$PWD/.ci/output:/app/output:ro" \
            readmission-api \
            python -m pytest -m "not full_dataset" tests/test_etl.py

      - name: Run FastAPI readiness smoke test
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            status=$?
            trap - EXIT
            echo "::group::FastAPI container logs"
            docker logs api_test || true
            echo "::endgroup::"
            docker rm --force api_test >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --detach --name api_test \
            -p 127.0.0.1:8000:8000 \
            -v "$PWD/.ci/output:/app/output:ro" \
            -v "$PWD/.ci/models:/app/models:ro" \
            readmission-api \
            uvicorn main:app --host 0.0.0.0 --port 8000

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              ready=true
              echo "FastAPI became ready on attempt ${attempt}."
              break
            fi

            if ! docker inspect --format '{{.State.Running}}' api_test 2>/dev/null | grep -q true; then
              echo "FastAPI container stopped before becoming ready."
              break
            fi

            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "FastAPI did not become ready within 60 seconds."
            exit 1
          fi
